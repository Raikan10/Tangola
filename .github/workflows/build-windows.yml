name: Build Windows

# Builds the unsigned Windows (NSIS) installer on a native Windows runner and
# attaches it to the matching GitHub Release. Free for public repos.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (e.g. v0.1.0-beta.1)'
        required: true
        default: 'v0.1.0-beta.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer (unsigned)
        run: npm run build:win

      - name: List artifacts
        run: ls -lh dist-electron/*.exe

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist-electron/*.exe --clobber
